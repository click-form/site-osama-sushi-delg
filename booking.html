<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Osama Sushi Славута - Забронювати</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-neutral-950 text-neutral-100 font-sans">
    <nav class="sticky top-0 z-50 bg-neutral-900/90 backdrop-blur-md border-b border-neutral-800 h-20 flex items-center justify-between px-6 max-w-7xl mx-auto">
        <a href="index.html" class="text-2xl font-bold text-amber-400">Osama Sushi</a>
        <div class="hidden md:flex space-x-2">
            <a href="index.html" class="hover:bg-amber-500/10 rounded-lg px-4 py-2 transition">Головна</a>
            <a href="about.html" class="hover:bg-amber-500/10 rounded-lg px-4 py-2 transition">Про нас</a>
            <a href="services.html" class="hover:bg-amber-500/10 rounded-lg px-4 py-2 transition">Меню</a>
            <a href="gallery.html" class="hover:bg-amber-500/10 rounded-lg px-4 py-2 transition">Галерея</a>
            <a href="booking.html" class="bg-amber-500 text-white rounded-lg px-4 py-2 transition">Забронювати</a>
            <a href="contacts.html" class="hover:bg-amber-500/10 rounded-lg px-4 py-2 transition">Контакти</a>
        </div>
    </nav>

    <div class="max-w-6xl mx-auto px-6 py-4">
        <nav class="text-sm text-neutral-400">
            <a href="index.html" class="hover:text-amber-400">Головна</a> > <span class="text-amber-400">Забронювати</span>
        </nav>
    </div>

    <section class="py-12 px-6">
        <div class="max-w-2xl mx-auto bg-neutral-900 border border-neutral-800 rounded-3xl shadow-2xl p-10">
            <h1 class="text-3xl font-bold mb-6 text-amber-400 text-center">Забронювати столик</h1>
            <form action="https://formsubmit.co/hello@example.com" method="POST" class="space-y-6">
                <div>
                    <label class="block text-sm font-medium text-neutral-300 mb-2">Ваше ім'я</label>
                    <input type="text" name="name" required class="w-k w-full px-5 py-4 bg-neutral-950 border-2 border-neutral-800 rounded-xl focus:border-amber-500 focus:ring-4 focus:ring-amber-500/20 text-white outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-neutral-300 mb-2">Номер телефону</label>
                    <input type="tel" name="phone" required class="w-full px-5 py-4 bg-neutral-950 border-2 border-neutral-800 rounded-xl focus:border-amber-500 focus:ring-4 focus:ring-amber-500/20 text-white outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-neutral-300 mb-2">Дата та час</label>
                    <input type="datetime-local" name="datetime" required class="w-full px-5 py-4 bg-neutral-950 border-2 border-neutral-800 rounded-xl focus:border-amber-500 focus:ring-4 focus:ring-amber-500/20 text-white outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-neutral-300 mb-2">Кількість гостей</label>
                    <input type="number" name="guests" min="1" max="20" value="2" required class="w-full px-5 py-4 bg-neutral-950 border-2 border-neutral-800 rounded-xl focus:border-amber-500 focus:ring-4 focus:ring-amber-500/20 text-white outline-none">
                </div>
                <button type="submit" class="w-full bg-gradient-to-r from-amber-500 to-orange-500 text-white py-5 rounded-xl text-lg font-bold hover:shadow-xl transition">Підтвердити бронювання</button>
            </form>
        </div>
    </section>

    <footer class="bg-neutral-900 text-neutral-300 py-12 border-t border-neutral-800">
        <div class="max-w-6xl mx-auto px-6 grid grid-cols-1 md:grid-cols-3 gap-8">
            <div>
                <h3 class="text-xl font-bold text-white mb-4">Osama Sushi</h3>
                <p>Найсмачніші суші у Славуті з доставкою та на самовинос.</p>
            </div>
            <div>
                <h3 class="text-xl font-bold text-white mb-4">Контакти</h3>
                <p>вулиця Соборності, Славута</p>
                <p>Телефон: +380634558517</p>
            </div>
            <div>
                <h3 class="text-xl font-bold text-white mb-4">Навігація</h3>
                <ul class="space-y-2">
                    <li><a href="index.html" class="hover:text-amber-400">Головна</a></li>
                    <li><a href="services.html" class="hover:text-amber-400">Меню</a></li>
                    <li><a href="contacts.html" class="hover:text-amber-400">Контакти</a></li>
                </ul>
            </div>
        </div>
    </footer>
<script>
    document.getElementById('mobile-toggle')?.addEventListener('click', function() {
      document.getElementById('mobile-menu')?.classList.toggle('hidden');
    });
    document.querySelectorAll('a[href^="#"]').forEach(a => {
      a.addEventListener('click', e => {
        const target = document.querySelector(a.getAttribute('href'));
        if (target) { e.preventDefault(); target.scrollIntoView({ behavior: 'smooth' }); }
      });
    });
  </script>
</body>
</html>
